<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Flip — Your DNS. One quick flip.</title>
  <desc id="description">A mint-green Flip wordmark and a glowing DNS toggle on a midnight-blue background.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="360" rx="26"/></clipPath>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c4ff8b"/><stop offset="1" stop-color="#62efcf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#61efc8" stop-opacity=".12"/><stop offset="1" stop-color="#61efc8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d6fff4" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="1200" height="360" rx="26" fill="#0c1422"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="url(#grid)" stroke="#233545"/>
  <ellipse cx="1010" cy="165" rx="350" ry="290" fill="url(#glow)"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="78" y="64" fill="#91aaa9" font-size="12" font-weight="700" letter-spacing="3">MADE FOR THE MAC MENU BAR</text>
    <text x="66" y="229" fill="url(#mint)" font-size="174" font-weight="900" font-style="italic" letter-spacing="-12">Flip</text>
    <text x="79" y="278" fill="#e0eceb" font-size="24" font-weight="500">Your DNS. One quick flip.</text>
    <g font-size="12" font-weight="600" fill="#9cb8bd">
      <rect x="79" y="305" width="103" height="27" rx="13.5" fill="#142331" stroke="#2c414d"/><text x="97" y="323">macOS 13+</text>
      <rect x="192" y="305" width="109" height="27" rx="13.5" fill="#142331" stroke="#2c414d"/><text x="210" y="323">Native Swift</text>
      <rect x="311" y="305" width="145" height="27" rx="13.5" fill="#142331" stroke="#2c414d"/><text x="329" y="323">No dependencies</text>
    </g>
    <path d="M926 83V111M926 249V277M700 180H724M1128 180H1152" stroke="#3b6065" stroke-width="2" stroke-linecap="round"/>
    <circle cx="926" cy="76" r="4" fill="#75deba"/><circle cx="1159" cy="180" r="4" fill="#75deba"/>
    <rect x="735" y="122" width="380" height="116" rx="58" fill="#152635" stroke="#35535d" stroke-width="2"/>
    <g fill="none" stroke="#a1c2c8" stroke-width="2">
      <circle cx="799" cy="180" r="24"/><ellipse cx="799" cy="180" rx="10" ry="24"/>
      <path d="M775 180H823M778 168Q799 178 820 168M778 192Q799 182 820 192"/>
    </g>
    <text x="844" y="189" fill="#d9e9e8" font-size="25" font-weight="700" letter-spacing="2">DNS</text>
    <circle cx="1055" cy="180" r="47" fill="url(#mint)"/>
    <path d="M1038 197L1072 163M1044 163H1072V191" fill="none" stroke="#102b2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#91b0b5" font-size="12" font-weight="700" letter-spacing="2">
      <text x="749" y="290">AUTOMATIC</text><text x="1001" y="290">PUBLIC DNS</text>
    </g>
    <path d="M900 285H979M973 279L979 285L973 291M906 279L900 285L906 291" fill="none" stroke="#577d82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
